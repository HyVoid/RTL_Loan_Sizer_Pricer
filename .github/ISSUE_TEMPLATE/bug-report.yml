name: "🐞 Report a Formula, Lookup, or Web Calculator Bug"
description: "Report a reproducible calculation error, XLOOKUP issue, or browser calculator bug."
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: "Where did the issue occur?"
      options:
        - "Offline Excel Workbook (.xlsx) — Microsoft 365 / Excel 2021+"
        - "Offline Excel Workbook (.xlsx) — Older Excel Version"
        - "Free Browser Calculator (GitHub Pages)"
        - "Google Sheets Preview"
    validations:
      required: true

  - type: input
    id: affected_tab
    attributes:
      label: "Affected worksheet or output field"
      placeholder: "e.g., 04_Calc_Engine Buy Rate lookup / 05_Quote_Summary Cash-to-Close"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Expected vs. actual result"
      description: "Explain what result you expected versus what appeared."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Synthetic steps to reproduce (FAKE borrower & deal values only)"
      placeholder: |
        1. Select Program = Heavy Rehab, FICO = 720
        2. Enter Purchase = $300,000, Rehab = $70,000, ARV = $465,000...
    validations:
      required: true

  - type: checkboxes
    id: privacy_check
    attributes:
      label: "Strict Privacy Confirmation (Required)"
      options:
        - label: "I have used fictional deal numbers only—NO real borrowers, addresses, credit reports, or live lender buy rates."
          required: true
